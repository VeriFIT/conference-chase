name: Validate data

on:
  push:
    paths: ["data/**", "agent/**"]
  pull_request:
    paths: ["data/**", "agent/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt
      - run: python agent/validate.py
