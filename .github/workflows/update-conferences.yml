name: Update conference data

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated conference ids to refresh (empty = stalest first)"
        required: false
        default: ""
      max_per_run:
        description: "Maximum number of conferences to refresh"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: update-conferences
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.select.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - id: select
        env:
          IDS: ${{ inputs.ids }}
          MAX: ${{ inputs.max_per_run || '10' }}
        run: |
          ids=$(python agent/select_stale.py --max "$MAX" --ids "$IDS" --explain)
          echo "Selected: $ids"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  gather:
    needs: select
    if: needs.select.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5 # at most 5 agents run at the same time
      matrix:
        id: ${{ fromJSON(needs.select.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: Gather ${{ matrix.id }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python agent/gather.py "${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.id }}
          path: out/${{ matrix.id }}.json
          retention-days: 14

  merge:
    needs: [select, gather]
    if: always() && needs.select.outputs.ids != '[]' && needs.select.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: out
          merge-multiple: true
      - id: merge
        run: |
          summary=$(python agent/merge.py)
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
      - name: Commit changes
        env:
          SUMMARY: ${{ steps.merge.outputs.summary }}
        run: |
          if git diff --quiet -- data/conferences.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conferences.json
          git commit -m "$SUMMARY"
          git pull --rebase
          git push
